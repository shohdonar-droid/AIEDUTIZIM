    <script>
      // Clean up cached service workers and cache storage to prevent white-screen load issues
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          for (let reg of regs) {
            reg.unregister().then(() => {
              console.log('Stale SW unregistered successfully');
            });
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(keys => {
          for (let key of keys) {
            caches.delete(key).then(() => {
              console.log('Cache storage cleared:', key);
            });
          }
        });
      }
    </script>
